[package]
name = "fft-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1"
fft-book = { path = "../fft-book" }
fft-core = { path = "../fft-core" }
fft-log = { path = "../fft-log" }
fft-profile = { path = "../fft-profile" }
fft-replay = { path = "../fft-replay" }

[dev-dependencies]
criterion.workspace = true
tempfile = "3"

[[bin]]
name = "fft-checkpoint"
path = "src/bin/fft-checkpoint.rs"

[[bench]]
name = "snapshot"
harness = false
