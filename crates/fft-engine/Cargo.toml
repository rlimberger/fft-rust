[package]
name = "fft-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
fft-book = { path = "../fft-book" }
fft-core = { path = "../fft-core" }
fft-log = { path = "../fft-log" }
fft-profile = { path = "../fft-profile" }
fft-replay = { path = "../fft-replay" }

[dev-dependencies]
criterion.workspace = true
tempfile = "3"

[[bin]]
name = "fft-checkpoint"
path = "src/bin/fft-checkpoint.rs"

[[bin]]
name = "m15-gate"
path = "src/bin/m15_gate/main.rs"

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "live_checkpoint"
harness = false
