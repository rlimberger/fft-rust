[package]
name = "fft-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fft-core = { path = "../fft-core" }
fft-engine = { path = "../fft-engine" }
# m5-scrub-burst: event-time bounds from the log index (not on the GUI path).
fft-log = { path = "../fft-log" }
gpui.workspace = true
gpui_platform.workspace = true
# America/Chicago session bounds + CT clock for the transport strip (same pin as ingest).
jiff = "=0.2.35"
# Gate evidence only (`--gate-out`); both versions already resolved in the lock file.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "fft"
path = "src/main.rs"

[[bin]]
name = "m4-agreement"
path = "src/bin/m4-agreement.rs"

[[bin]]
name = "m5-scrub-burst"
path = "src/bin/m5-scrub-burst.rs"

[[bin]]
name = "m5-rss-week"
path = "src/bin/m5-rss-week.rs"
