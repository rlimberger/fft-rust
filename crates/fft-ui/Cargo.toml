[package]
name = "fft-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fft-core = { path = "../fft-core" }
fft-engine = { path = "../fft-engine" }
gpui.workspace = true
gpui_platform.workspace = true
# Gate evidence only (`--gate-out`); both versions already resolved in the lock file.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "fft"
path = "src/main.rs"

[[bin]]
name = "m4-agreement"
path = "src/bin/m4-agreement.rs"
