[package]
name = "fft-replay"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fft-book = { path = "../fft-book" }
fft-core = { path = "../fft-core" }
fft-log = { path = "../fft-log" }
fft-profile = { path = "../fft-profile" }
# Gate evidence JSON only (`m1-gate`/`m2-gate` bins); versions match fft-ui.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "m1-gate"
path = "src/bin/m1_gate/main.rs"

[[bin]]
name = "m2-gate"
path = "src/bin/m2_gate/main.rs"

[[bin]]
name = "claim4-census"
path = "src/bin/claim4_census/main.rs"
