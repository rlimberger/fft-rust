[package]
name = "fft-ingest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fft-core = { path = "../fft-core" }
fft-log = { path = "../fft-log" }
# Official Databento DBN codec, pinned exactly. Deliberately NOT the `databento`
# client crate: no networking, no tokio in this crate (AGENTS.md doctrine 9).
dbn = "=0.65.0"
jiff = "=0.2.35"
# Same zstd dbn itself decodes through (dbn requires ^0.13); needed only to *name*
# the reader type in `decode::ZstdFileDecoder`.
zstd = "=0.13.3"

[dev-dependencies]
sha2 = "=0.11.0"

[[bin]]
name = "fft-ingest"
path = "src/main.rs"
