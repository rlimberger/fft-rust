[workspace]
resolver = "3"
members = [
    "crates/fft-core",
    "crates/fft-log",
    "crates/fft-book",
    "crates/fft-profile",
    "crates/fft-engine",
    "crates/fft-replay",
    "crates/fft-ingest",
    "crates/fft-feed",
    "crates/fft-ui",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# rlimberger/zed branch `fft-inactive-throttle-optout`: zed main pinned at 492acd6c
# (2026-08-10) + one commit adding the GPUI_DISABLE_INACTIVE_THROTTLE opt-out — upstream
# GPUI hard-caps unfocused windows to ~30fps (window.rs min_frame_interval), which fails
# the frame gate for an unfocused market display. At this rev the platform entry point
# (`application()`) lives in `gpui_platform`; its `wayland` feature selects the
# Linux/Wayland backend (off by default).
gpui = { git = "https://github.com/rlimberger/zed", rev = "34ba175b1f48e40de4d6d7dfcbca1c6235d006b5" }
gpui_platform = { git = "https://github.com/rlimberger/zed", rev = "34ba175b1f48e40de4d6d7dfcbca1c6235d006b5", features = ["wayland"] }
criterion = "0.8"
